limit_req_zone $binary_remote_addr zone=ppt_web:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=ppt_generate:10m rate=6r/m;

log_format ppt_svg '$remote_addr - $remote_user [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                   'rt=$request_time uct=$upstream_connect_time '
                   'uht=$upstream_header_time urt=$upstream_response_time';

upstream ppt_svg_next {
  server 127.0.0.1:3000;
  keepalive 32;
}

server {
  listen 80;
  listen [::]:80;
  server_name labs.graptolite.ai;

  real_ip_header CF-Connecting-IP;
  real_ip_recursive on;
  set_real_ip_from 173.245.48.0/20;
  set_real_ip_from 103.21.244.0/22;
  set_real_ip_from 103.22.200.0/22;
  set_real_ip_from 103.31.4.0/22;
  set_real_ip_from 141.101.64.0/18;
  set_real_ip_from 108.162.192.0/18;
  set_real_ip_from 190.93.240.0/20;
  set_real_ip_from 188.114.96.0/20;
  set_real_ip_from 197.234.240.0/22;
  set_real_ip_from 198.41.128.0/17;
  set_real_ip_from 162.158.0.0/15;
  set_real_ip_from 104.16.0.0/13;
  set_real_ip_from 104.24.0.0/14;
  set_real_ip_from 172.64.0.0/13;
  set_real_ip_from 131.0.72.0/22;
  set_real_ip_from 2400:cb00::/32;
  set_real_ip_from 2606:4700::/32;
  set_real_ip_from 2803:f800::/32;
  set_real_ip_from 2405:b500::/32;
  set_real_ip_from 2405:8100::/32;
  set_real_ip_from 2a06:98c0::/29;
  set_real_ip_from 2c0f:f248::/32;

  access_log /var/log/nginx/ppt-svg.access.log ppt_svg;
  error_log /var/log/nginx/ppt-svg.error.log warn;

  absolute_redirect off;
  limit_req_status 429;
  # Matches the app's 13 MB upload ceiling (file-limits.ts); 4m produced 413s
  # for allowed images/PPTX larger than 4 MB.
  client_max_body_size 13m;

  # Edge security headers (mirror next.config.mjs; also cover any direct-origin hit).
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;

  location = /ppt {
    return 308 /ppt/en;
  }

  location = /ppt/ {
    return 308 /ppt/en;
  }

  location = /ppt/healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location ^~ /ppt/api/generate {
    limit_req zone=ppt_generate burst=3 nodelay;
    proxy_pass http://ppt_svg_next;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
  }

  location ^~ /ppt/_next/static/ {
    limit_req zone=ppt_web burst=20 nodelay;
    proxy_pass http://ppt_svg_next;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location ^~ /ppt/ {
    limit_req zone=ppt_web burst=20 nodelay;
    proxy_pass http://ppt_svg_next;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
  }
}

# --- Optional origin TLS (recommended: Cloudflare Full (Strict)) ---
# The block above listens on :80 only, so origin<->Cloudflare traffic (carrying
# API keys and session ids) is plaintext. To encrypt it, install a Cloudflare
# Origin Certificate and enable a 443 server that reuses the same locations.
# Then set the Cloudflare SSL/TLS mode to "Full (Strict)".
#
# server {
#   listen 443 ssl http2;
#   listen [::]:443 ssl http2;
#   server_name labs.graptolite.ai;
#
#   ssl_certificate     /etc/ssl/cloudflare/ppt-svg.pem;
#   ssl_certificate_key /etc/ssl/cloudflare/ppt-svg.key;
#   ssl_protocols TLSv1.2 TLSv1.3;
#   ssl_prefer_server_ciphers off;
#   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
#
#   # ... copy real_ip_*, limit_req, client_max_body_size, add_header, and all
#   #     location blocks from the :80 server above ...
# }
#
# To force HTTPS at the origin, replace the :80 server body with:
#   return 308 https://$host$request_uri;
