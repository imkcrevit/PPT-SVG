# systemd-tmpfiles rules for PPT-SVG ephemeral artifacts.
#
# Install:  sudo cp deploy/systemd/ppt-svg-tmpfiles.conf /etc/tmpfiles.d/ppt-svg.conf
# Apply now: sudo systemd-tmpfiles --clean /etc/tmpfiles.d/ppt-svg.conf
# (systemd-tmpfiles-clean.timer then runs it periodically.)
#
# Note: the service also reaps these directories itself (src/lib/artifact-cleanup.ts),
# which is what runs when PrivateTmp=yes gives the service a private /tmp that host
# tmpfiles rules cannot see. Keep this file for deploys that do NOT use PrivateTmp.
#
# Type 'e' cleans directory contents older than the age (48h) without creating them.
e /tmp/ppt-svg/uploads  - - - 2d
e /tmp/ppt-svg/sessions - - - 2d
e /tmp/ppt-svg/failures - - - 2d
